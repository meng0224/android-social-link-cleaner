name: Dispatch README sync

on:
  issues:
    types: [opened]

permissions:
  actions: write

jobs:
  dispatch:
    if: github.event.issue.title == '[temporary] dispatch README sync'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch one-time workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/one-time-readme-sync.yml/dispatches" \
            -d '{"ref":"main"}'
